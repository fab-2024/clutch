<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Clutch">
  <!--
    Le sceau Clutch : carré aux angles très arrondis, fond Volt, C noir.

    Le C est tracé comme un arc épais et non comme une lettre : une police
    absente ou substituée déformerait le logo, alors qu'un chemin est
    strictement identique partout, à toutes les tailles.
  -->
  <rect width="100" height="100" rx="27" fill="#E8FF3D" />
  <path d="M 63.6 63.6 A 19.2 19.2 0 1 1 63.6 36.4"
        fill="none" stroke="#080B10" stroke-width="11.5" stroke-linecap="butt" />
</svg>
